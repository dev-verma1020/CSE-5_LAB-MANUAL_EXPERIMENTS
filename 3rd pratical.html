
<!DOCTYPE html>
<html>
<head>
    <title>College Timetable</title>
</head>
<body>

    <h1>College Timetable</h1>

    <table border="1" cellpadding="10">
        <caption>Weekly Timetable</caption>

        <tr>
            <th rowspan="2">Day</th>
            <th colspan="2">Morning</th>
            <th rowspan="2">Lunch</th>
            <th colspan="2">Afternoon</th>
        </tr>

        <tr>
            <th>9-10 AM</th>
            <th>10-11 AM</th>
            <th>2-3 PM</th>
            <th>3-4 PM</th>
        </tr>

        <tr>
            <th>Monday</th>
            <td>Maths</td>
            <td>Physics</td>
            <td rowspan="5">1-2 PM</td>
            <td>CAD</td>
            <td>Computer</td>
        </tr>

        <tr>
            <th>Tuesday</th>
            <td>CAD</td>
            <td>Maths</td>
            <td>Physics</td>
            <td>C++</td>
        </tr>

        <tr>
            <th>Wednesday</th>
            <td>Physics</td>
            <td>C++</td>
            <td colspan="2">
                <table border="1" cellpadding="5">
                    <caption>Lab Details</caption>
                    <tr>
                        <th>Lab No.</th>
                        <th>Subject</th>
                    </tr>
                    <tr>
                        <td>1</td>
                        <td>C++</td>
                    </tr>
                </table>
            </td>
        </tr>

        <tr>
            <th>Thursday</th>
            <td>Maths</td>
            <td>Electrical</td>
            <td>C++</td>
            <td>Physics</td>
        </tr>

        <tr>
            <th>Friday</th>
            <td>C++</td>
            <td>Physics</td>
            <td>Maths</td>
            <td>Electrical</td>
        </tr>

    </table>

</body>
</html>
